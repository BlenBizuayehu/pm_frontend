<h2>Manage Projects</h2>
<table>
  <thead>
    <tr>
      <th>Project Name</th>
      <th>Status</th>
      <th>Number of Tasks</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let project of projects">
      <td>{{ project.name }}</td>
      <td>{{ project.status }}</td>
      <td>{{ project.tasks }}</td>
      <td>
        <button (click)="deleteProject(project.id)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>

<button (click)="addProject()">+ Add Project</button>
