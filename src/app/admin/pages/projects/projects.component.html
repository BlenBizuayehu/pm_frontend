<h2>Manage Projects</h2>
<table>
  <thead>
    <tr>
      <th>Project Name</th>
      <th>Status</th>
      <th>Number of Tasks</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let project of projects">
      <td>{{ project.name }}</td>
      <td>{{ project.status }}</td>
      <td>{{ project.tasks }}</td>
      <td>
        <button (click)="deleteProject(project.id)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>

<!-- Add New Project Button to Show Form -->
<button (click)="toggleAddProjectForm()">+ Add Project</button>

<!-- Add Project Form -->
<div *ngIf="showAddProjectForm">
  <h3>Add New Project</h3>
  <form (ngSubmit)="addProject()">
    <label for="projectName">Project Name:</label>
    <input
      type="text"
      id="projectName"
      [(ngModel)]="newProject.name"
      name="projectName"
      required
    />
    <label for="projectStatus">Project Status:</label>
    <input
      type="text"
      id="projectStatus"
      [(ngModel)]="newProject.status"
      name="projectStatus"
      required
    />
    <button type="submit">Add Project</button>
    <button type="button" (click)="toggleAddProjectForm()">Cancel</button>
  </form>
</div>
