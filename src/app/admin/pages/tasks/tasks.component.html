<h2>Manage Tasks</h2>
<table>
  <thead>
    <tr>
      <th>Task Name</th>
      <th>Status</th>
      <th>Project</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let task of tasks">
      <td>{{ task.name }}</td>
      <td>{{ task.status }}</td>
      <td>{{ task.project }}</td>
      <td>
        <button (click)="deleteTask(task.id)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>

<button (click)="addTask()">+ Add Task</button>
